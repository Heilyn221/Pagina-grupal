<html>
    <head>
        <title>SOLUCION ejercicio banderas</title>
        <style>
            div{width:300px;height:200px;margin:20px;
	display:inline-block;
	border:1px solid #000;
	text-align:center;
	font-weight:bold;
}

.costarica{
	background-image:linear-gradient(
		#002B7F 20%,
		white 20%, white 40%,
		#CE1126 40%, #CE1126 60%,
		white 60%, white 80%,
		#002B7F 80%
	);
}

.espana{
	background-image:linear-gradient(
		#AA151B 25%,
		#F1BF00 25%, #F1BF00 75%,
		#AA151B 75%
	);
}

.mexico{
	background-image:linear-gradient(90deg,
		#006847 33%,
		white 33%, white 66%,
		#CE1126 66%
	);
	color:#000;
}

.colombia{
	background-image:linear-gradient(
		#FCD116 50%,
		#003893 50%, #003893 75%,
		#CE1126 75%
	);
}

.argentina{
	background-image:linear-gradient(
		#74ACDF 33%,
		white 33%, white 66%,
		#74ACDF 66%
	);
	color:#000;
}

.brasil{
	background-image:
		radial-gradient(circle, #002776 18%, transparent 19%),
		linear-gradient(45deg, transparent 24%, #FEDF00 25%, #FEDF00 75%, transparent 76%),
		linear-gradient(-45deg, transparent 24%, #FEDF00 25%, #FEDF00 75%, transparent 76%),
		#009739;
}
        </style>

    </head>
    <body>
        <div class="costarica">costa rica</div>
        <div class="espana">espana</div>
        <div class="mexico">mexico</div>
        <div class="colombia">colombia</div>
        <div class="argentina">argentina</div>
        <div class="brasil">brasil</div>
    </body>
</html>
