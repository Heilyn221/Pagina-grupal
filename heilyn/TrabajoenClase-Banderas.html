<!DOCTYPE html>
<html>
<head>
	<title>solución ejercicio de banderas</title>

<style>
div{width:300px;height:200px;margin:20px;
	display:inline-block;
	border:1px solid #000;
}
.colombia{
	background-image:linear-gradient(yellow 33%, blue 33%, blue 66.66%, red 66.66%);
}

.francia{
	background-image:linear-gradient(90deg,red 33%, white 33%, white 66.66%, blue 66.66%);
}

.italia{
	background-image:linear-gradient(90deg, green 33%, white 33%, white 66.66%, red 66.66%);
}

.alemania{
	background-image:linear-gradient(black 33%, red 33%, red 66.66%, yellow 66.66%);
	color:#fff;
}

.japon{
	background-image:radial-gradient(circle, red 33%, white 33%, white);
}

.polonia{
	background-image:linear-gradient(white 50%, red 50%, red);
}

.paisesbajos{
	background-image:linear-gradient(red 33.33%, white 33.33%, white 66.66%, blue 66.66%);
}

.austria{
	background-image:linear-gradient(red 33.33%, white 33.33%, white 66.66%, red 66.66%);
}

.hungria{
	background-image:linear-gradient(red 33.33%, white 33.33%, white 66.66%, green 66.66%);
}

.belgica{
	background-image:linear-gradient(90deg, black 33.33%, yellow 33.33%, yellow 66.66%, red 66.66%);
}

.rumania{
	background-image:linear-gradient(90deg, blue 33.33%, yellow 33.33%, yellow 66.66%, red 66.66%);
}

.monaco{
	background-image:linear-gradient(red 50%, white 50%, white);
}
</style>

</head>
<body>

	<div class="colombia">colombia</div>
	<div class="francia">francia</div>
	<div class="italia">italia</div>
	<div class="alemania">alemania</div>
	<div class="japon">japón</div>
	<div class="polonia">polonia</div>
	<div class="paisesbajos">países bajos</div>
	<div class="austria">austria</div>
	<div class="hungria">hungría</div>
	<div class="belgica">bélgica</div>
	<div class="rumania">rumanía</div>
	<div class="monaco">mónaco</div>

</body>
</html>
